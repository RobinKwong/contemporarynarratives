<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=0.5, maximum-scale=5">

    <!-- Main JS (navbar.js, masonry_init.js and the cookie/analytics code)-->
    <script defer src="{{ '/assets/js/main.min.js' | relative_url }}"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

    <!--Favicon-->
    <link rel="shortcut icon" href="{{ site.favicon | relative_url }}" type="image/x-icon">

    <!-- Read by the cookie/analytics code bundled in main.min.js; both are off in _config.yml -->
    <script>
      const cookieName = 'cookie-notice-dismissed-{{ site.url }}';
      const isCookieConsent = '{{ site.cookie_consent }}';
      const analyticsName = '{{ site.google_analytics }}';
    </script>


    <!-- seo tags -->
    <meta property="og:image" content="{{ '/' | absolute_url }}{% if page.thumbnail %}{{ page.thumbnail }}{% else %}{{ page.feature-img | default: site.social_image }}{% endif %}">
    {% seo %}
    {% if page.noindex %}
    <!-- unlisted page: reachable by link, kept out of search engines (pair with sitemap: false) -->
    <meta name="robots" content="noindex, nofollow">
    {% endif %}

    <!-- RSS -->
    {% feed_meta %}

    <!-- Twitter Cards: title/description/card come from the seo tag above; here we add only the image + attribution it does not provide -->
    {% if site.data.social.twitter %}
    <meta name="twitter:creator" content="@{{ site.data.social.twitter }}">
    <meta name="twitter:site" content="@{{ site.data.social.twitter }}">
    {% endif %}
    <meta name="twitter:image" content="{{ '/' | absolute_url }}{% if page.thumbnail %}{{ page.thumbnail }}{% else %}{{ page.feature-img | default: site.social_image }}{% endif %}">
    <meta name="twitter:image:alt" content="{{ page.title | default: site.title }}">
</head>
