{% assign cde = site.data.cde %}
<div class="cde-nav" role="navigation" aria-label="Creative Data Exchange">
  <ul>
    {% for item in cde.nav %}
    {% assign item_url = cde.base | append: item.url %}
    <li><a href="{{ item_url | relative_url }}"{% if page.url == item_url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
    {% endfor %}
    <li><a class="cde-join" href="{{ cde.join_form }}">Join the community</a></li>
  </ul>
</div>
