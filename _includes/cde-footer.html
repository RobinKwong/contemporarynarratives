{% assign cde = site.data.cde %}
<div>
  <h2>Creative Data Exchange</h2>
  <ul>
    {% for item in cde.nav %}
    <li><a href="{{ cde.base | append: item.url | relative_url }}">{{ item.title }}</a></li>
    {% endfor %}
    <li><a href="{{ cde.join_form }}">Join our community</a></li>
    <li>{% if cde.updates_link != "" %}<a href="{{ cde.updates_link }}">Sign up to updates</a>{% else %}Sign up to updates <span class="cde-todo">link to come</span>{% endif %}</li>
  </ul>
</div>
