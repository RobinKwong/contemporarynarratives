# SITE CONFIGURATION
baseurl: ""
url: "https://contemporarynarratives.org"

# THEME-SPECIFIC CONFIGURATION
title: "Contemporary Narratives Lab"                                   # site's title
description: "Bringing art and journalism together"      # used by search engines
avatar: assets/img/CNLlogo.png                         # Empty for no avatar in navbar
favicon: assets/favicon.ico                             # Icon displayed in the tab

# Header and footer text
header_text: Contemporary Narratives Lab # Change Blog header text
header_feature_image: assets/img/pexels/homepage.jpg
social_image: assets/img/CNL_Twitter.jpg  
footer_text: " "

# Blog
excerpt: true                                           # Or "truncate" (first 40 words), "false" to disable
post_navigation: true
color_image: /assets/img/lineart.png                    # A bit transparent for color posts.

# Features
# More in the _data folder for social icons, share buttons, author and language
# For layout customization, go to the "_sass > base" folder, and check "_variables.scss"
google_analytics:                                       # Tracking ID, e.g. "UA-000000-01"
cookie_consent: false                                   # To respect the usage of cookies
disqus_shortname:                                       # Your discus shortname for comments

# PAGINATION
paginate: 5
paginate_path: "/blog/page:num"

# PORTFOLIO
collections:
  portfolio:
    output: true
    permalink: /:collection/:name

# BUILD SETTINGS
plugins: [jekyll-paginate, jekyll-seo-tag, jekyll-feed, jekyll-sitemap]
# Repo housekeeping stays off the site. The private wiki/raw/outputs folders are git-excluded,
# so CI never sees them, but a plain local build would publish them without these entries.
exclude: [".jekyll-cache", ".idea", "vendor/*", "assets/node_modules",
          "README.md", "LICENSE", "*.gemspec", "assets/Dockerfile", "assets/gulpfile.js", "assets/package.json",
          "wiki", "raw", "outputs", "CLAUDE.md"]

# Theme is vendored directly in this repo (_includes, _layouts, _sass).
# No `theme:` or `remote_theme:` — Jekyll uses the local theme files as-is.
